# The URL the site will be built for
base_url = "https://cyzmix.net"
theme = "kita"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

[markdown]

# The Kita theme config.
[extra]
# Enable KaTex math formula support globally.
math = false
# Enable mermaid support globally.
mermaid = false
# Enable comment support globally.
comment = false
# Enable floating table of contents on the right side of the post page.
side_toc = true
# The URL of social image.
social_image = "icons/github.svg"

# The Kita style config.
[extra.style]
# The custom background color.
# bg_color = ""

# The custom background color in dark mode.
# bg_dark_color = ""

# Enable header blur.
# header_blur = true

# The custom header color, only available when `header_blur` is false.
# header_color = ""

# The custom header color in dark mode, only available when `header_blur` is false.
# header_dark_color = ""

# The profile on home page.
[extra.profile]
name = "CyzmiX"
bio = "Im a 18 years old, morrocan software engineer intrested in software and system's design"
# The URL of avatar.
avatar_url = "icons/pfp.jpeg"
# Invert color in dark mode.
avatar_invert = false

# The social icons below the profile on the home page.
# The `name` should be the file name of static/icons/*.svg or the icon name of https://simpleicons.org/
[[extra.profile.social]]
name = "github"
url = "https://github.com/ItzCyzmiX"

[[extra.profile.social]]
name = "twitter"
url = "https://x.com/ItzCyzmiX"

# The top menu.
[[extra.menu]]
name = "Home"
url = "$BASE_URL/"

[[extra.menu]]
name = "Projects"
url = "$BASE_URL/projects"

[[extra.menu]]
name = "About"
url = "$BASE_URL/about"

# The giscus comment options, only available when comment is enabled.
[extra.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = 1
reactions_enabled = 0
emit_metadata = 0
input_position = "top"
theme = "light"
lang = "en"
loading = "lazy"
